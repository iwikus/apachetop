name: Debian packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example v1.1)"
        required: true
        default: "v1.1"

jobs:
  build:
    name: Debian ${{ matrix.suite }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bookworm
            image: debian:12
          - suite: trixie
            image: debian:13
          - suite: jammy
            image: ubuntu:22.04
          - suite: noble
            image: ubuntu:24.04
          - suite: resolute
            image: ubuntu:26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            debhelper-compat \
            apache2 \
            apache2-dev \
            curl \
            procps \
            ca-certificates

      - name: Configure Apache prefork and ExtendedStatus
        run: |
          a2dismod -f mpm_event || true
          a2dismod -f mpm_worker || true
          a2enmod mpm_prefork
          a2enmod status

          cat >/etc/apache2/conf-available/apachetop-ci.conf <<'EOF'
          ServerName localhost
          ExtendedStatus On
          EOF

          a2enconf apachetop-ci
          apache2ctl -t
          apache2ctl -M 2>&1 | grep -q 'mpm_prefork_module (shared)'
          apache2ctl -M 2>&1 | grep -q 'status_module (shared)'

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          ls -lh ../*.deb

      - name: Start Apache and test mod_status
        run: |
          apache2ctl -k start

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/server-status?auto >/tmp/server-status.txt 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat /tmp/server-status.txt
          grep -q '^Scoreboard:' /tmp/server-status.txt
          grep -q '^BusyWorkers:' /tmp/server-status.txt
          grep -q '^IdleWorkers:' /tmp/server-status.txt

          echo "Apache configuration:"
          apache2ctl -t -D DUMP_RUN_CFG || true
          echo "Apache processes:"
          pgrep -a apache2 || true

      - name: Test packaged binary
        run: |
          DEB=$(ls -1 ../apachetop_*.deb | head -n1)
          mkdir -p /tmp/pkg
          dpkg-deb -x "$DEB" /tmp/pkg

          dpkg-deb -f "$DEB" Package | grep -qx apachetop
          dpkg-deb -f "$DEB" Version
          VERSION_OUTPUT=$(/tmp/pkg/usr/bin/apachetop --version)
          echo "apachetop version output: <$VERSION_OUTPUT>"
          test "$VERSION_OUTPUT" = "apachetop 1.1"

          if ls /dev/shm/ShM.* >/dev/null 2>&1; then
            SHM=$(ls -1 /dev/shm/ShM.* | head -n1)
            timeout 5 /tmp/pkg/usr/bin/apachetop -1 -f "$SHM" > /tmp/apachetop.out

            grep -q 'ApacheTop scoreboard' /tmp/apachetop.out
            grep -q '^Apache layout:' /tmp/apachetop.out
            grep -q '^Requests:' /tmp/apachetop.out
            grep -q '^States:' /tmp/apachetop.out

            cat /tmp/apachetop.out
          else
            echo "Apache did not expose a readable scoreboard file in this CI image."
            echo "Compile/package and mod_status tests passed; direct scoreboard integration is skipped."
          fi

      - name: Stage Debian package for artifact upload
        run: |
          mkdir -p artifacts
          DEB=$(ls -1 ../apachetop_*.deb | head -n1)
          VERSION=$(dpkg-deb -f "$DEB" Version)
          FILE_VERSION="${VERSION#*:}"
          ARCH=$(dpkg-deb -f "$DEB" Architecture)
          cp "$DEB" "artifacts/apachetop_${FILE_VERSION}_${{ matrix.suite }}_${ARCH}.deb"
          ls -lh artifacts/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: apachetop-${{ matrix.suite }}
          path: artifacts/*.deb
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download Bookworm package
        uses: actions/download-artifact@v4
        with:
          name: apachetop-bookworm
          path: release

      - name: Download Trixie package
        uses: actions/download-artifact@v4
        with:
          name: apachetop-trixie
          path: release

      - name: Download Jammy package
        uses: actions/download-artifact@v4
        with:
          name: apachetop-jammy
          path: release

      - name: Download Noble package
        uses: actions/download-artifact@v4
        with:
          name: apachetop-noble
          path: release

      - name: Download Resolute package
        uses: actions/download-artifact@v4
        with:
          name: apachetop-resolute
          path: release

      - name: Remove obsolete unqualified package assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              case "$asset" in
                apachetop_*_amd64.deb)
                  case "$asset" in
                    *_bookworm_amd64.deb|*_trixie_amd64.deb|*_jammy_amd64.deb|*_noble_amd64.deb|*_resolute_amd64.deb)
                      ;;
                    *)
                      gh release delete-asset "$TAG" "$asset" --yes
                      ;;
                  esac
                  ;;
              esac
            done
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release/*.deb

  apt-repository:
    name: APT repository
    if: needs.release.result == 'success'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Build APT repository
        env:
          GH_TOKEN: \${{ github.token }}
          APT_GPG_PRIVATE_KEY: \${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: \${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          test -n "$APT_GPG_PRIVATE_KEY" || {
            echo "APT_GPG_PRIVATE_KEY repository secret is not configured."
            exit 1
          }

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "sec" {print $5; exit}')
          test -n "$KEY_ID"

          SITE="$RUNNER_TEMP/apachetop-pages"
          mkdir -p "$SITE/pool/main/a/apachetop"
          mkdir -p "$SITE/dists"

          echo "Downloading Debian packages from published GitHub releases..."
          gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' |
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "  $tag"
            gh release download "$tag" \
              --pattern 'apachetop_*_amd64.deb' \
              --dir "$SITE/pool/main/a/apachetop" \
              --clobber
          done

          for suite in bookworm trixie jammy noble resolute; do
            mkdir -p "$SITE/dists/\${suite}/main/binary-amd64"
            STAGING="$RUNNER_TEMP/scan-\${suite}"
            rm -rf "$STAGING"
            mkdir -p "$STAGING/pool/main/a/apachetop"

            find "$SITE/pool/main/a/apachetop" -maxdepth 1 -type f \
              -name "*_\${suite}_amd64.deb" -exec cp {} "$STAGING/pool/main/a/apachetop/" \;

            test -n "$(find "$STAGING/pool/main/a/apachetop" -type f -name '*.deb' -print -quit)" || {
              echo "No \${suite} package found in published releases."
              exit 1
            }

            (
              cd "$STAGING"
              dpkg-scanpackages -m pool /dev/null \
                > "$SITE/dists/\${suite}/main/binary-amd64/Packages"
            )

            gzip -9 -c "$SITE/dists/\${suite}/main/binary-amd64/Packages" \
              > "$SITE/dists/\${suite}/main/binary-amd64/Packages.gz"

            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin=apachetop \
              -o APT::FTPArchive::Release::Label=apachetop \
              -o APT::FTPArchive::Release::Suite="\${suite}" \
              -o APT::FTPArchive::Release::Codename="\${suite}" \
              -o APT::FTPArchive::Release::Components=main \
              -o APT::FTPArchive::Release::Architectures=amd64 \
              release "$SITE/dists/\${suite}" \
              > "$SITE/dists/\${suite}/Release"

            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$APT_GPG_PASSPHRASE" \
              --local-user "$KEY_ID" \
              --armor --detach-sign \
              --output "$SITE/dists/\${suite}/Release.gpg" \
              "$SITE/dists/\${suite}/Release"

            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$APT_GPG_PASSPHRASE" \
              --local-user "$KEY_ID" \
              --clearsign \
              --output "$SITE/dists/\${suite}/InRelease" \
              "$SITE/dists/\${suite}/Release"
          done

          gpg --armor --export "$KEY_ID" > "$SITE/apachetop.gpg"

          cat > "$SITE/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>apachetop APT repository</title>
          <h1>apachetop APT repository</h1>
          <p>Packages for Debian and Ubuntu are available through APT.</p>
          <p>Repository key: <a href="apachetop.gpg">apachetop.gpg</a></p>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: \${{ runner.temp }}/apachetop-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
