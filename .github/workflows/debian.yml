name: Debian packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Debian ${{ matrix.suite }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bookworm
            image: debian:12
          - suite: trixie
            image: debian:13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            debhelper-compat \
            apache2 \
            apache2-dev \
            curl \
            procps \
            ca-certificates

      - name: Configure Apache prefork and ExtendedStatus
        run: |
          a2dismod -f mpm_event || true
          a2dismod -f mpm_worker || true
          a2enmod mpm_prefork
          a2enmod status

          cat >/etc/apache2/conf-available/apachetop-ci.conf <<'EOF'
          ServerName localhost
          ExtendedStatus On
          EOF

          a2enconf apachetop-ci
          apache2ctl -t
          apache2ctl -M 2>&1 | grep -q 'mpm_prefork_module (shared)'

      - name: Start Apache and wait for scoreboard
        run: |
          apache2ctl -DFOREGROUND >/tmp/apache2.log 2>&1 &
          APACHE_PID=$!

          for i in $(seq 1 30); do
            if ls /dev/shm/ShM.* >/dev/null 2>&1 && curl -fsS http://127.0.0.1/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          test -n "$(ls -1 /dev/shm/ShM.* 2>/dev/null | head -n1)"
          curl -fsS http://127.0.0.1/ >/dev/null

          echo "Apache PID: $APACHE_PID"
          pgrep -a apache2 || true
          ls -lh /dev/shm/ShM.*
          ps -ef

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          ls -lh ../*.deb

      - name: Test packaged binary against Apache scoreboard
        run: |
          DEB=$(ls -1 ../apachetop-scoreboard_*.deb | head -n1)
          mkdir -p /tmp/pkg
          dpkg-deb -x "$DEB" /tmp/pkg

          SHM=$(ls -1 /dev/shm/ShM.* | head -n1)
          test -n "$SHM"

          timeout 5 /tmp/pkg/usr/bin/apachetop-scoreboard -1 -f "$SHM" > /tmp/apachetop.out

          grep -q '^ApacheTop scoreboard' /tmp/apachetop.out
          grep -q '^Apache layout:' /tmp/apachetop.out
          grep -q '^Requests:' /tmp/apachetop.out
          grep -q '^States:' /tmp/apachetop.out

          cat /tmp/apachetop.out

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: apachetop-scoreboard-${{ matrix.suite }}
          path: ../apachetop-scoreboard_*.deb
          if-no-files-found: error
