name: Debian packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Debian ${{ matrix.suite }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bookworm
            image: debian:12
          - suite: trixie
            image: debian:13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            debhelper-compat \
            apache2 \
            apache2-dev \
            curl \
            procps \
            ca-certificates

      - name: Configure Apache prefork and ExtendedStatus
        run: |
          a2dismod -f mpm_event || true
          a2dismod -f mpm_worker || true
          a2enmod mpm_prefork
          a2enmod status

          cat >/etc/apache2/conf-available/apachetop-ci.conf <<'EOF'
          ServerName localhost
          ExtendedStatus On
          EOF

          a2enconf apachetop-ci
          apache2ctl -t
          apache2ctl -M 2>&1 | grep -q 'mpm_prefork_module (shared)'
          apache2ctl -M 2>&1 | grep -q 'status_module (shared)'

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          ls -lh ../*.deb

      - name: Start Apache and test mod_status
        run: |
          apache2ctl -k start

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/server-status?auto >/tmp/server-status.txt 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat /tmp/server-status.txt
          grep -q '^Scoreboard:' /tmp/server-status.txt
          grep -q '^BusyWorkers:' /tmp/server-status.txt
          grep -q '^IdleWorkers:' /tmp/server-status.txt

          echo "Apache configuration:"
          apache2ctl -t -D DUMP_RUN_CFG || true
          echo "Apache processes:"
          pgrep -a apache2 || true

      - name: Test packaged binary when named SHM scoreboard is available
        run: |
          if ls /dev/shm/ShM.* >/dev/null 2>&1; then
            DEB=$(ls -1 ../apachetop-scoreboard_*.deb | head -n1)
            mkdir -p /tmp/pkg
            dpkg-deb -x "$DEB" /tmp/pkg

            SHM=$(ls -1 /dev/shm/ShM.* | head -n1)
            timeout 5 /tmp/pkg/usr/bin/apachetop-scoreboard -1 -f "$SHM" > /tmp/apachetop.out

            grep -q '^ApacheTop scoreboard' /tmp/apachetop.out
            grep -q '^Apache layout:' /tmp/apachetop.out
            grep -q '^Requests:' /tmp/apachetop.out
            grep -q '^States:' /tmp/apachetop.out

            cat /tmp/apachetop.out
          else
            echo "Debian Apache did not expose a named /dev/shm/ShM.* scoreboard in this CI image."
            echo "Compile/package and mod_status tests passed; direct SHM integration is skipped."
          fi

      - name: Stage Debian package for artifact upload
        run: |
          mkdir -p artifacts
          cp ../apachetop-scoreboard_*.deb artifacts/
          ls -lh artifacts/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: apachetop-scoreboard-${{ matrix.suite }}
          path: artifacts/*.deb
          if-no-files-found: error
